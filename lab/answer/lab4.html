<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11주차 실습 4 모범답안</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>11주차 실습 4 모범답안</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    실습 4 모범답안 — 스스로 해 본 뒤에 보세요
    */
    const products = [
      { id: 1, name: '노트북', price: 1200000, stock: 5 },
      { id: 2, name: '마우스', price: 25000, stock: 0 },
      { id: 3, name: '노트', price: 3000, stock: 42 },
    ];

    // ① 총 재고 금액
    const totalValue = products.reduce((sum, p) => sum + p.price * p.stock, 0);
    console.log('총 재고 금액:', totalValue.toLocaleString() + '원');

    // ② 품절 상품
    const soldOut = products.filter(p => p.stock === 0).map(p => p.name);
    console.log('품절:', soldOut);

    // ③ 가장 비싼 상품 (원본을 건드리지 않으려고 복사 후 정렬)
    const priciest = [...products].sort((a, b) => b.price - a.price)[0];
    console.log('최고가:', priciest.name);
  </script>
</body>
</html>
