  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }

    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>11주차 예제 18 · 거의 모든 웹 데이터가 이 모양입니다</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    11주차 예제 18 — 거의 모든 웹 데이터가 이 모양입니다
    */
    const products = [
      { id: 1, name: '노트북', price: 1200000, category: '전자', stock: 5 },
      { id: 2, name: '마우스', price: 25000,   category: '전자', stock: 0 },
      { id: 3, name: '노트',   price: 3000,    category: '문구', stock: 42 },
    ];

    // 재고 있는 전자제품만
    const available = products.filter(p => p.category === '전자' && p.stock > 0);

    // 이름만 뽑기
    const names = products.map(p => p.name);

    // 총 재고 금액
    const totalValue = products.reduce((sum, p) => sum + p.price * p.stock, 0);

    // id로 찾기
    const item = products.find(p => p.id === 2);

    // 가격순 정렬 (원본 보존)
    const cheap = [...products].sort((a, b) => a.price - b.price);

    // 화면에 그릴 HTML 만들기
    const html = products
      .map(p => `<li>${p.name} — ${p.price.toLocaleString()}원</li>`)
      .join('');
  </script>

</html>
