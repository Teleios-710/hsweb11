<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11주차 예제 21 · Math는 new 없이 바로 씁니다</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>11주차 예제 21 · Math는 new 없이 바로 씁니다</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    11주차 예제 21 — Math는 new 없이 바로 씁니다
    */
    Math.round(3.6)      // 4    반올림
    Math.floor(3.9)      // 3    내림
    Math.ceil(3.1)       // 4    올림
    Math.trunc(-3.9)     // -3   소수점 버리기(음수 주의: floor는 -4)
    Math.abs(-5)         // 5    절댓값
    Math.max(1, 5, 3)    // 5
    Math.min(1, 5, 3)    // 1
    Math.pow(2, 10)      // 1024  (2 ** 10 과 같음)
    Math.sqrt(16)        // 4
    Math.PI              // 3.141592653589793
    Math.random()        // 0 이상 1 미만 난수

    // 1~n 무작위 정수 — 자주 쓰는 관용구
    function randInt(n) { return Math.floor(Math.random() * n) + 1; }

    // 배열에서 무작위로 하나 고르기
    const arr = ['가위', '바위', '보'];
    arr[Math.floor(Math.random() * arr.length)]
  </script>
</body>
</html>
