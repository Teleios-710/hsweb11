<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11주차 예제 2 · 요즘 더 많이 쓰는 모양</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>11주차 예제 2 · 요즘 더 많이 쓰는 모양</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    11주차 예제 2 — 요즘 더 많이 쓰는 모양
    */
    // 함수 선언
    function add(a, b) { return a + b; }

    // 함수 표현식
    const add2 = function (a, b) { return a + b; };

    // 화살표 함수
    const add3 = (a, b) => { return a + b; };

    // 몸통이 return 하나면 중괄호와 return을 생략할 수 있습니다
    const add4 = (a, b) => a + b;

    // 매개변수가 하나면 괄호도 생략 가능 (팀 관례에 따라 붙이기도 합니다)
    const double = n => n * 2;

    // 매개변수가 없으면 빈 괄호
    const now = () => new Date();

    // 객체를 돌려줄 때는 괄호로 감쌉니다 — 안 그러면 중괄호를 몸통으로 봅니다
    const makeUser = (name) => ({ name, year: 1 });
  </script>
</body>
</html>
