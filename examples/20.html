<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11주차 예제 20 · 자주 쓰는 문자열 메서드</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>11주차 예제 20 · 자주 쓰는 문자열 메서드</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    11주차 예제 20 — 자주 쓰는 문자열 메서드
    */
    const s = '  Hello Web Programming  ';

    s.length                    // 25
    s.trim()                    // 앞뒤 공백 제거 — 입력값 검사에 필수
    s.toUpperCase()             // 대문자로
    s.toLowerCase()             // 소문자로
    s.includes('Web')           // true — 포함하는가
    s.startsWith('  He')        // true
    s.endsWith('  ')            // true
    s.indexOf('Web')            // 8 — 없으면 -1
    s.replace('Web', '웹')       // 첫 하나만 바꾼다
    s.replaceAll(' ', '_')      // 전부 바꾼다
    s.split(' ')                // 공백으로 잘라 배열로
    s.slice(2, 7)               // 일부 잘라내기
    s.padStart(3, '0')          // '007' 처럼 앞을 채우기
    s.repeat(2)                 // 두 번 반복

    // ⚠ 문자열은 바뀌지 않습니다(immutable).
    //   s.toUpperCase()는 새 문자열을 돌려줄 뿐 s 자체는 그대로입니다.
  </script>
</body>
</html>
